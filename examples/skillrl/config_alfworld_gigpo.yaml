# SkillRL on AReaL - ALFWorld task (template retrieval mode, GiGPO, NPU/vLLM)
#
# GiGPO (Group-in-Group) variant of config_alfworld.yaml. Differences vs GRPO:
#   - gigpo.enable: true               -> train.py selects SkillPPOTrainer +
#     SkillFSDPPPOActor (GiGPO advantage branch) and installs a
#     SkillGigpoNormConfig on actor.reward_norm (param carrier; no-op norm).
#   - actor.reward_norm: null          -> GiGPO does its own two-level norm.
#   - actor.adv_norm: null             -> no batch advantage norm (GiGPO is
#     outcome-based; A^E+ω·A^S is already normalized).
#   - actor.reward_scaling/bias: 1.0/0.0  -> do not rescale the pre-computed
#     per-row advantage (train.py enforces this regardless).
#   - actor.reward_clip: 1000.0        -> default 20 would truncate GiGPO
#     advantages.
#   - gigpo.gamma: 0.95, mode: mean_std_norm  -> faithful to run_alfworld.sh.
# See github/doc/SkillRL_GiGPO_适配AReaL方案.md.
#
experiment_name: skillrl-alfworld-gigpo
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 3
tokenizer_path: ${actor.path}

# ---- SkillRL task config (SkillRLConfig extra fields) ----
env:
  env_name: alfworld              # dispatch key in train.py
  max_steps: 50
  history_length: 2               # last N (obs, action) pairs rendered as action_history
  train_num_episodes: 1000        # counter-dataset rows per train epoch (env picks games on reset)
  val_num_episodes: 128           # counter-dataset rows per eval
  alfworld:
    eval_dataset: eval_in_distribution

skills_only_memory:
  skills_json_path: examples/skillrl/memory_data/alfworld/claude_style_skills.json
  retrieval_mode: template        # NPU-first: template (zero GPU). embedding mode later.
  top_k: 6
  task_specific_top_k: 4
  enable_dynamic_update: false     # pillar C: recursive skill evolution
  update_threshold: 0.4
  max_new_skills: 3
  skill_update_freq: 16           # evolve every N trajectories (≈ 1 train step @ batch 16)
  embedding_device: cpu

# ---- GiGPO advantage config (read by train.py) ----
gigpo:
  enable: true
  step_advantage_w: 1.0           # ω in Eq. 8 (paper uses 1.0, no tuning)
  mode: mean_std_norm             # faithful to run_alfworld.sh (shipped script)
  gamma: 0.95                     # Eq. 5 discount (alfworld shipped: 0.95)
  enable_similarity: false        # Phase 1: exact-match anchor grouping only (alfworld)
  similarity_thresh: 0.95         # unused when enable_similarity=false (Phase 3: search)

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/skillrl_experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

allocation_mode: vllm:d4p1t1+d4p1t1

scheduler:
  type: null

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 64
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false

gconfig:
  n_samples: 8                    # GRPO/GiGPO group size (replaces SkillRL's env.rollout.n)
  min_new_tokens: 0
  max_new_tokens: 512
  greedy: false
  temperature: 1.0

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen2.5-1.5B-Instruct
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer:
    type: adam
    lr: 1.0e-6
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  # GiGPO: pre-computed per-row advantage is transported via the GAE path; do
  # not rescale / re-normalize it. (train.py enforces these regardless.)
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  reward_clip: 1000.0             # default 20 would truncate GiGPO advantages
  ppo_n_minibatches: 1            # GiGPO needs the full prompt block in compute_advantages
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  reward_norm: null               # GiGPO installs a SkillGigpoNormConfig (no-op norm) in train.py
  adv_norm: null                  # GiGPO advantage is already normalized (A^E+ω·A^S)
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        VLLM_USE_V1: "1"
        VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
        TASK_QUEUE_ENABLE: "2"
        HCCL_EXEC_TIMEOUT: "14400"
        HCCL_OP_EXPANSION_MODE: "HOST"
        ACL_DEVICE_SYNC_TIMEOUT: "14400"
        HCCL_EVENT_TIMEOUT: "14500"
        HCCL_ASYNC_ERROR_HANDLING: "0"
        ACL_STREAM_TIMEOUT: "14500000"
        HCCL_CONNECT_TIMEOUT: "7200"
        PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer: null
  behave_imp_weight_mode: disabled
  behave_imp_weight_cap: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.5

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8

# ALFWorld is env-driven: the env picks its own game on reset, so the dataset
# is a counter (one row per episode). The episode count is set on `env`
# (train_num_episodes / val_num_episodes); no external QA dataset is needed.
train_dataset:
  path: alfworld                 # required by TrainDatasetConfig schema; unused (counter dataset, pre-built in train.py)
  batch_size: 16
  shuffle: true
  pin_memory: true
  num_workers: 4
  type: rl
  max_length: 32768  # alfworld: up to 50 steps, each turn prompt+response ~500 tokens

valid_dataset:
  path: alfworld                 # required by schema; unused (counter dataset)
  batch_size: 16
  pin_memory: true
  num_workers: 4
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
