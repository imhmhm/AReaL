# SkillRL on AReaL - ALFWorld task (template retrieval mode, GRPO, NPU/vLLM)
#
# Run:
#   ALFWORLD_DATA=<path-to-alfworld-json_2.1.1> \
#   python -m examples.skillrl.train --config examples/skillrl/config_alfworld.yaml
#
# External deps (must be installed separately - not vendored):
#   - textworld, textworld.gym (pip)
#   - $ALFWORLD_DATA pointing at alfworld's json_2.1.1/{train,valid_seen,valid_unseen}
#     (logic files alfred.pddl/alfred.twl2 are vendored under env_package/alfworld/alfworld/data/)
# The vendored alfworld package (with the use_expert=False RL pin) is used via
# sys.path, taking precedence over any pip alfworld.

experiment_name: skillrl-alfworld
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 3
tokenizer_path: ${actor.path}

# ---- SkillRL task config (SkillRLConfig extra fields) ----
env:
  env_name: alfworld              # dispatch key in train.py
  max_steps: 50
  history_length: 2               # last N (obs, action) pairs rendered as action_history
  alfworld:
    eval_dataset: eval_in_distribution

skills_only_memory:
  skills_json_path: examples/skillrl/memory_data/alfworld/claude_style_skills.json
  retrieval_mode: template        # NPU-first: template (zero GPU). embedding mode later.
  top_k: 6
  task_specific_top_k: 4
  enable_dynamic_update: true     # pillar C: recursive skill evolution
  update_threshold: 0.4
  max_new_skills: 3
  skill_update_freq: 16           # evolve every N trajectories (≈ 1 train step @ batch 16)
  embedding_device: cpu

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/skillrl_experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

# vLLM is NPU-adapted in this environment (no need for sglang).
allocation_mode: vllm:d4p1t1+d4p1t1

scheduler:
  type: null

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 64
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false

gconfig:
  n_samples: 8                    # GRPO group size (replaces SkillRL's env.rollout.n)
  min_new_tokens: 0
  max_new_tokens: 512
  greedy: false
  temperature: 1.0

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen2.5-1.5B-Instruct
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer:
    type: adam
    lr: 1.0e-6
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

# vLLM (NPU-adapted)
vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.5

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8

# ALFWorld is env-driven: the env picks its own game on reset, so the dataset
# is a counter (num_episodes rows). No external QA dataset needed.
train_dataset:
  batch_size: 16
  shuffle: true
  pin_memory: true
  num_workers: 4
  num_episodes: 1000
  type: rl
  max_length: 4096

valid_dataset:
  batch_size: 16
  pin_memory: true
  num_workers: 4
  num_episodes: 128
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
