# SkillRL on AReaL — Search task (template retrieval mode, GRPO, NPU/vLLM)
#
# Run:
#   python -m examples.skillrl.train --config examples/skillrl/config_search.yaml
#
# Adapted from examples/multi_turn_math/gsm8k_grpo_mt.yaml + SkillRL run scripts.
# Skills are injected via SkillsOnlyMemory (template mode by default — zero GPU,
# safe first milestone on NPU). Set retrieval_mode=embedding + embedding_device
# for semantic retrieval once the embedding model is NPU-ready.

experiment_name: skillrl-search
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 3
tokenizer_path: ${actor.path}

# ---- SkillRL task config (SkillRLConfig extra fields) ----
env:
  max_steps: 8
  search:
    search_url: http://127.0.0.1:8000/retrieve   # SearchEnv retrieval backend
    topk: 3
    timeout: 30
    log_requests: true

skills_only_memory:
  skills_json_path: examples/skillrl/memory_data/search/claude_style_skills.json
  retrieval_mode: template        # NPU-first: template (zero GPU). embedding mode later.
  top_k: 6
  task_specific_top_k: 4
  enable_dynamic_update: true     # pillar C: recursive skill evolution (milestone 2)
  update_threshold: 0.4           # evolve when recent success_rate < this
  max_new_skills: 3
  skill_update_freq: 16           # evolve every N trajectories (≈ 1 train step @ batch 16)
  embedding_device: cpu            # only used when retrieval_mode=embedding

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/skillrl_experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

# vLLM is NPU-adapted in this environment (no need for sglang).
allocation_mode: vllm:d4p1t1+d4p1t1

scheduler:
  type: null

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 64
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false

gconfig:
  n_samples: 8                  # GRPO group size (replaces SkillRL's env.rollout.n)
  min_new_tokens: 0
  max_new_tokens: 512
  greedy: false
  temperature: 1.0

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen2.5-7B-Instruct
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer:
    type: adam
    lr: 1.0e-6
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 10.0
  reward_bias: -0.5
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

# vLLM (NPU-adapted)
vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.5

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8

# datasets — point to a Search-R1 style QA dataset with question/answer fields.
# Replace path with your own local/HF QA dataset.
train_dataset:
  batch_size: 16
  shuffle: true
  pin_memory: true
  num_workers: 4
  path: PeterJinGo/Search-R1-zhihu-clean
  type: rl
  max_length: 4096

valid_dataset:
  batch_size: 16
  pin_memory: true
  num_workers: 4
  path: PeterJinGo/Search-R1-zhihu-clean
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
