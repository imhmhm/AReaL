# SkillRL on AReaL - WebShop task (template retrieval mode, GiGPO, NPU/vLLM)
#
# GiGPO variant of config_webshop.yaml. Differences vs GRPO:
#   - gigpo.enable: true               -> train.py selects SkillPPOTrainer +
#     SkillFSDPPPOActor (GiGPO advantage branch) and installs a
#     SkillGigpoNormConfig on actor.reward_norm (param carrier; no-op norm).
#   - actor.reward_norm: null          -> GiGPO does its own two-level norm.
#   - actor.adv_norm: null             -> GiGPO advantage already normalized.
#   - actor.reward_scaling/bias: 1.0/0.0, reward_clip: 1000.0  -> do not
#     rescale/clip the pre-computed per-row advantage (train.py enforces this).
#   - gigpo.mode: mean_norm            -> faithful to run_webshop.sh (webshop
#     uses mean_norm; alfworld uses mean_std_norm).
#   - skills_only_memory.enable_dynamic_update: false  -> pillar C (skill
#     evolution) is unsupported on AReaL (train.py fail-fasts); the GRPO
#     webshop config had this true (latent crash). GiGPO is advantage-only.
# See github/doc/SkillRL_GiGPO_适配AReaL方案.md (Phase 2).
#
# Run (after preparing WebShop data via env_package/webshop/webshop/setup.sh):
#   python -m examples.skillrl.train --config examples/skillrl/config_webshop_gigpo.yaml
# External runtime deps (NOT vendored; prepare via webshop/setup.sh):
#   - data/items_shuffle[_1000].json, items_ins_v2[_1000].json, items_human_ins.json
#   - search_engine/indexes/ (Lucene index)
#   - spacy en_core_web_sm, pyserini (+ Java 11), thefuzz, flask, bs4

experiment_name: skillrl-webshop-gigpo
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 3
tokenizer_path: ${actor.path}

# ---- SkillRL task config (SkillRLConfig extra fields) ----
env:
  env_name: webshop               # dispatch key in train.py
  max_steps: 15
  history_length: 2               # last N (obs, action) pairs rendered as action_history
  train_num_episodes: 1000        # counter-dataset rows per train epoch (env picks a goal on reset)
  val_num_episodes: 128           # counter-dataset rows per eval
  webshop:
    use_small: true               # use the 1000-item subset (faster); false -> full
    human_goals: false

skills_only_memory:
  skills_json_path: examples/skillrl/memory_data/webshop/claude_style_skills.json
  retrieval_mode: template
  top_k: 6
  task_specific_top_k: 4
  enable_dynamic_update: false     # pillar C unsupported on AReaL (train.py fail-fasts); GiGPO is advantage-only
  update_threshold: 0.4
  max_new_skills: 3
  skill_update_freq: 16
  embedding_device: cpu

# ---- GiGPO advantage config (read by train.py) ----
gigpo:
  enable: true
  step_advantage_w: 1.0           # ω in Eq. 8 (paper uses 1.0, no tuning)
  mode: mean_norm                 # faithful to run_webshop.sh (webshop uses mean_norm)
  gamma: 0.95                     # Eq. 5 discount (webshop shipped: 0.95)
  enable_similarity: false        # exact-match anchor grouping only (webshop)
  similarity_thresh: 0.95         # unused when enable_similarity=false (Phase 3: search)

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/skillrl_experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

allocation_mode: vllm:d4p1t1+d4p1t1

scheduler:
  type: null

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 64
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 2
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: false

gconfig:
  n_samples: 8                    # GRPO/GiGPO group size
  min_new_tokens: 0
  max_new_tokens: 768
  greedy: false
  temperature: 1.0

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen2.5-1.5B-Instruct
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer:
    type: adam
    lr: 1.0e-6
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  # GiGPO: pre-computed per-row advantage transported via the GAE path; do not
  # rescale / re-normalize it. (train.py enforces these regardless.)
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  reward_clip: 1000.0             # default 20 would truncate GiGPO advantages
  ppo_n_minibatches: 1            # GiGPO needs the full prompt block in compute_advantages
  recompute_logprob: true
  use_decoupled_loss: true
  behave_imp_weight_cap: 5.0
  reward_norm: null               # GiGPO installs a SkillGigpoNormConfig (no-op norm) in train.py
  adv_norm: null                  # GiGPO advantage is already normalized (A^E+ω·A^S)
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 10240
  optimizer: null
  behave_imp_weight_mode: disabled
  behave_imp_weight_cap: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

vllm:
  model: ${actor.path}
  seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_model_len: 32768
  gpu_memory_utilization: 0.5

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8

# WebShop is env-driven: the env picks a goal session on reset, so the dataset
# is a counter (one row per episode). The episode count is set on `env`
# (train_num_episodes / val_num_episodes); no external QA dataset is needed.
train_dataset:
  path: webshop                  # required by TrainDatasetConfig schema; unused (counter dataset, pre-built in train.py)
  batch_size: 16
  shuffle: true
  pin_memory: true
  num_workers: 4
  type: rl
  max_length: 16384  # webshop: up to 15 steps, each turn prompt+response ~500 tokens

valid_dataset:
  path: webshop                  # required by schema; unused (counter dataset)
  batch_size: 16
  pin_memory: true
  num_workers: 4
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
